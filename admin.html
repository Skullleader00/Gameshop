<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — GameShop</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Sarabun:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --r:#e8001d;--rd:#9a0013;--rg:#ff2040;
  --b:#070707;--b2:#0f0f0f;--b3:#181818;--b4:#222;
  --g:#333;--gl:#777;--gll:#aaa;
  --w:#f0eaea;--wd:#b8b0b0;
  --green:#00e676;--orange:#ff9100;
  --fd:'Rajdhani',sans-serif;--fb:'Sarabun',sans-serif;--fm:'Share Tech Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--b);color:var(--w);font-family:var(--fb);min-height:100vh}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);pointer-events:none;z-index:9999}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--b)}::-webkit-scrollbar-thumb{background:var(--rd)}

#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(180,0,18,.14),transparent 70%)}
.login-box{background:var(--b2);border:1px solid var(--rd);width:100%;max-width:380px;padding:2rem;box-shadow:0 0 50px rgba(180,0,20,.2)}
.login-logo{font-family:var(--fd);font-size:2rem;font-weight:700;letter-spacing:4px;color:var(--r);text-shadow:0 0 18px rgba(232,0,29,.5);margin-bottom:.2rem}
.login-sub{font-family:var(--fm);font-size:.68rem;color:var(--gl);letter-spacing:2px;margin-bottom:2rem}
.fl{display:block;font-family:var(--fm);font-size:.68rem;color:var(--r);letter-spacing:2px;margin-bottom:.35rem}
.fi{width:100%;background:var(--b3);border:1px solid var(--g);color:var(--w);font-family:var(--fb);font-size:.88rem;padding:.55rem .85rem;outline:none;transition:border-color .2s;margin-bottom:1rem}
.fi:focus{border-color:var(--r);box-shadow:0 0 8px rgba(200,0,20,.18)}
.login-btn{width:100%;background:var(--r);border:none;color:#fff;font-family:var(--fd);font-size:1rem;font-weight:700;letter-spacing:2px;padding:.75rem;cursor:pointer;transition:all .2s}
.login-btn:hover{background:var(--rg);box-shadow:0 0 20px rgba(255,0,60,.4)}
.login-err{color:var(--orange);font-family:var(--fm);font-size:.75rem;margin-bottom:.8rem;display:none}

#adminApp{display:none}
.admin-header{background:rgba(7,7,7,.97);border-bottom:2px solid var(--r);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;backdrop-filter:blur(12px)}
.ah-left{display:flex;align-items:center;gap:1rem}
.ah-logo{font-family:var(--fd);font-size:1.3rem;font-weight:700;letter-spacing:3px;color:var(--r)}
.ah-tag{font-family:var(--fm);font-size:.62rem;color:var(--r);border:1px solid var(--rd);padding:.15rem .5rem;letter-spacing:1px}
.ah-right{display:flex;gap:.5rem}
.abtn{background:none;border:1px solid var(--g);color:var(--wd);font-family:var(--fb);font-size:.78rem;padding:.3rem .8rem;cursor:pointer;transition:all .2s;text-decoration:none}
.abtn:hover{border-color:var(--r);color:var(--r)}
.abtn.pri{background:var(--r);border-color:var(--r);color:#fff}

.tabs{display:flex;border-bottom:1px solid var(--b4);padding:0 1.5rem;background:var(--b2)}
.tab{font-family:var(--fm);font-size:.75rem;letter-spacing:1px;padding:.85rem 1.2rem;cursor:pointer;color:var(--gl);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab.on{color:var(--r);border-bottom-color:var(--r)}

.panel{display:none;padding:1.5rem;max-width:900px;margin:0 auto}
.panel.on{display:block}

.sec{background:var(--b2);border:1px solid var(--b4);margin-bottom:1.2rem}
.sec-head{padding:.9rem 1.2rem;border-bottom:1px solid var(--b4);display:flex;align-items:center;justify-content:space-between}
.sec-title2{font-family:var(--fd);font-size:1rem;letter-spacing:2px;color:var(--wd)}
.sec-body{padding:1.2rem}

.fg{margin-bottom:1rem}
.fs,.fta{width:100%;background:var(--b3);border:1px solid var(--g);color:var(--w);font-family:var(--fb);font-size:.88rem;padding:.55rem .85rem;outline:none;transition:border-color .2s;resize:none}
.fs:focus,.fta:focus{border-color:var(--r)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.fbtn{background:var(--r);border:none;color:#fff;font-family:var(--fd);font-size:.9rem;font-weight:700;letter-spacing:1px;padding:.65rem 1.5rem;cursor:pointer;transition:all .2s}
.fbtn:hover{background:var(--rg);box-shadow:0 0 16px rgba(255,0,60,.4)}
.fbtn.secondary{background:var(--b3);border:1px solid var(--g);color:var(--wd)}
.fbtn.danger{background:#1a0004;border:1px solid #5a0010;color:#ff4060}

.prod-list{display:flex;flex-direction:column;gap:.5rem}
.prod-row{display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem;background:var(--b3);border:1px solid var(--b4);transition:border-color .2s}
.prod-img{width:40px;height:40px;object-fit:cover;border:1px solid var(--b4)}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-meta{font-family:var(--fm);font-size:.65rem;color:var(--gl);margin-top:.15rem}
.stock-badge{display:inline-block;font-family:var(--fm);font-size:.62rem;padding:.1rem .4rem;margin-left:.4rem}
.stock-badge.ok{background:rgba(0,230,118,.12);color:var(--green);border:1px solid rgba(0,230,118,.3)}
.stock-badge.low{background:rgba(255,145,0,.12);color:var(--orange);border:1px solid rgba(255,145,0,.3)}
.stock-badge.out{background:var(--b4);color:var(--gl);border:1px solid var(--g)}
.prod-actions{display:flex;gap:.4rem;flex-shrink:0}
.ia{background:none;border:1px solid var(--g);color:var(--wd);font-size:.7rem;padding:.28rem .65rem;cursor:pointer;font-family:var(--fm);transition:all .2s}
.ia:hover{border-color:var(--r);color:var(--r)}
.ia.danger{border-color:#3a0008;color:#c04050}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:800;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .22s}
.ov.on{opacity:1;pointer-events:all}
.modal{background:var(--b2);border:1px solid var(--rd);width:100%;max-width:460px;max-height:92vh;overflow-y:auto;transform:translateY(16px);transition:transform .22s;box-shadow:0 0 50px rgba(180,0,20,.25)}
.ov.on .modal{transform:translateY(0)}
.mhead{padding:1rem 1.3rem;border-bottom:1px solid var(--b4);display:flex;align-items:center;justify-content:space-between}
.mtitle{font-family:var(--fd);font-size:1.1rem;letter-spacing:2px;color:var(--r)}
.mclose{background:none;border:1px solid var(--g);color:var(--gl);width:26px;height:26px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .2s}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--b2);border:1px solid var(--r);padding:.7rem 1.1rem;font-family:var(--fm);font-size:.78rem;color:var(--w);z-index:9000;transform:translateX(140%);transition:transform .28s;box-shadow:0 0 18px rgba(200,0,20,.3);max-width:280px}
.toast.show{transform:translateX(0)}.toast.err{border-color:var(--orange)}

.img-preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.5rem}
.img-preview-item{position:relative;aspect-ratio:1;background:var(--b3);border:1px solid var(--b4);overflow:hidden}
.img-preview-item img{width:100%;height:100%;object-fit:cover}
.img-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;border:none;width:18px;height:18px;font-size:10px;cursor:pointer}

@media(max-width:560px){
  .frow{grid-template-columns:1fr}
  .panel{padding:1rem}
  .tabs{padding:0 .8rem}
  .tab{padding:.75rem .8rem;font-size:.7rem}
}
</style>
</head>
<body>

<div id="blankPage" style="min-height:100vh;display:flex;align-items:center;justify-content:center">
  <div style="font-family:var(--fm);font-size:.75rem;color:#111;user-select:none">404</div>
</div>

<div id="loginScreen" style="display:none">
  <div class="login-box">
    <div class="login-logo">ADMIN</div>
    <div class="login-sub">GAMESHOP CONTROL PANEL</div>
    <label class="fl">อีเมล</label>
    <input class="fi" id="loginEmail" type="email" placeholder="admin@example.com">
    <label class="fl">รหัสผ่าน</label>
    <input class="fi" id="loginPw" type="password" placeholder="••••••••">
    <div class="login-err" id="loginErr">อีเมลหรือรหัสผ่านไม่ถูกต้อง</div>
    <button class="login-btn" id="loginBtnEl" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<div id="adminApp">
  <div class="admin-header">
    <div class="ah-left">
      <div class="ah-logo" id="ahLogo">ADMIN</div>
      <div class="ah-tag">⚙ CONTROL PANEL</div>
    </div>
    <div class="ah-right">
      <a href="index.html" class="abtn">← หน้าร้าน</a>
      <button class="abtn" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on" onclick="switchTab(this,'tabDashboard')">📊 ภาพรวม</div>
    <div class="tab" onclick="switchTab(this,'tabProducts')">📦 สินค้า</div>
    <div class="tab" onclick="switchTab(this,'tabSettings')">⚙ ตั้งค่าร้าน</div>
  </div>

  <div id="tabDashboard" class="panel on">
    <div class="sec">
      <div class="sec-head"><div class="sec-title2">สถิติร้านค้า</div></div>
      <div class="sec-body">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem">
          <div style="background:var(--b3);padding:1.5rem;text-align:center;border:1px solid var(--b4)">
            <div style="font-size:2rem;font-weight:700;color:var(--r)" id="st1">0</div>
            <div style="font-size:.7rem;color:var(--gl)">สินค้าทั้งหมด</div>
          </div>
          <div style="background:var(--b3);padding:1.5rem;text-align:center;border:1px solid var(--b4)">
            <div style="font-size:2rem;font-weight:700;color:var(--green)" id="st2">0</div>
            <div style="font-size:.7rem;color:var(--gl)">พร้อมขาย</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="tabProducts" class="panel">
    <div class="sec">
      <div class="sec-head">
        <div class="sec-title2">รายการสินค้า</div>
        <button class="abtn pri" onclick="openAddModal()">+ เพิ่มสินค้า</button>
      </div>
      <div class="sec-body">
        <div class="prod-list" id="prodList"></div>
      </div>
    </div>
  </div>

  <div id="tabSettings" class="panel">
    <div class="sec">
      <div class="sec-head"><div class="sec-title2">ข้อมูลร้านค้า</div></div>
      <div class="sec-body">
        <div class="fg"><label class="fl">ชื่อร้าน</label><input class="fi" id="sName"></div>
        <div class="fg"><label class="fl">Facebook URL / Username</label><input class="fi" id="sFb" placeholder="เช่น https://facebook.com/username หรือ username"></div>
        <div class="fg"><label class="fl">คำอธิบายร้าน</label><textarea class="fta" id="sDesc" rows="3"></textarea></div>
        <button class="fbtn" onclick="saveSettings()">💾 บันทึกการตั้งค่า</button>
      </div>
    </div>
  </div>
</div>

<div class="ov" id="ovAdd" onclick="if(event.target===this)closeOv('ovAdd')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="mhead"><div class="mtitle" id="addTitle">+ เพิ่มสินค้า</div><button class="mclose" onclick="closeOv('ovAdd')">✕</button></div>
    <div class="mbody">
      <div class="fg"><label class="fl">ชื่อสินค้า *</label><input class="fi" id="fTitle"></div>
      <div class="frow">
        <div class="fg"><label class="fl">ชื่อเกม *</label><input class="fi" id="fGame"></div>
        <div class="fg"><label class="fl">หมวดหมู่</label>
          <select class="fs" id="fCat">
            <option value="mobile">📱 มือถือ</option>
            <option value="pc">💻 PC</option>
            <option value="console">🎮 Console</option>
            <option value="item">🎁 Item/สกิน</option>
            <option value="account">👤 Account</option>
          </select>
        </div>
      </div>
      <div class="fg"><label class="fl">รายละเอียด</label><textarea class="fta" id="fDesc" rows="2"></textarea></div>
      <div class="frow">
        <div class="fg"><label class="fl">ราคา (บาท) *</label><input class="fi" id="fPrice" type="number"></div>
        <div class="fg"><label class="fl">จำนวนสต็อก *</label><input class="fi" id="fStock" type="number"></div>
      </div>
      <div class="fg">
        <label class="fl">รูปภาพสินค้า (สูงสุด 3 รูป)</label>
        <input type="file" id="fImgInput" accept="image/*" multiple style="display:none" onchange="handleImgUpload(this)">
        <button class="abtn" onclick="document.getElementById('fImgInput').click()">📁 เลือกรูปภาพ</button>
        <div class="img-preview-grid" id="imgPreview"></div>
      </div>
      <div class="fg">
        <label class="fl">Badge</label>
        <select class="fs" id="fBadge">
          <option value="">ไม่มี</option>
          <option value="hot">🔥 HOT</option>
          <option value="new">✨ NEW</option>
        </select>
      </div>
      <div style="display:flex;gap:.6rem">
        <button class="fbtn" id="saveBtn" onclick="saveProduct()">💾 บันทึก</button>
        <button class="fbtn secondary" onclick="closeOv('ovAdd')">ยกเลิก</button>
        <button class="fbtn danger" id="delBtn" style="display:none;margin-left:auto" onclick="deleteProduct()">🗑 ลบ</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
import { FIREBASE_CONFIG } from "./firebase-config.js";

let app, auth, db, storage;
let allProducts = [];
let shopInfo = {};
let editingId = null;
let currentImages = [];

const SECRET_KEY = 'Kengshop';
const params = new URLSearchParams(window.location.search);
if (params.get('key') !== SECRET_KEY) {
  document.getElementById('blankPage').style.display = 'flex';
  throw new Error('Access denied');
}
document.getElementById('blankPage').style.display = 'none';

try {
  app = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(app);
  db = getDatabase(app);
  storage = getStorage(app);
  onAuthStateChanged(auth, user => {
    if (user) { showAdmin(); } else { showLogin(); }
  });
} catch(e) { showLogin(); }

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminApp').style.display = 'none';
}
function showAdmin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminApp').style.display = 'block';
  listenData();
}

window.doLogin = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPw').value;
  if (!email || !pw) return;
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch(e) { toast('อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'err'); }
};
window.doLogout = () => signOut(auth);

function listenData() {
  onValue(ref(db, 'shop'), snap => {
    shopInfo = snap.val() || {};
    document.getElementById('sName').value = shopInfo.name || '';
    document.getElementById('sFb').value = shopInfo.fb || '';
    document.getElementById('sDesc').value = shopInfo.desc || '';
    document.getElementById('ahLogo').textContent = (shopInfo.name || 'ADMIN').toUpperCase();
  });
  onValue(ref(db, 'products'), snap => {
    const d = snap.val();
    allProducts = d ? Object.entries(d).map(([id, v]) => ({ id, ...v })) : [];
    allProducts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderProdList();
    renderDashboard();
  });
}

function renderDashboard() {
  document.getElementById('st1').textContent = allProducts.length;
  document.getElementById('st2').textContent = allProducts.filter(p => p.stock > 0).length;
}

function renderProdList() {
  const el = document.getElementById('prodList');
  if (!allProducts.length) {
    el.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--gl)">ยังไม่มีสินค้า</div>';
    return;
  }
  el.innerHTML = allProducts.map(p => `
    <div class="prod-row">
      <img src="${p.images ? p.images[0] : ''}" class="prod-img" onerror="this.src='https://placehold.co/40x40?text=No+Img'">
      <div class="prod-info">
        <div class="prod-name">${p.customId || p.id} - ${p.title}</div>
        <div class="prod-meta">${p.game} · ฿${Number(p.price).toLocaleString()}</div>
      </div>
      <div class="prod-actions">
        <button class="ia" onclick="openEditModal('${p.id}')">แก้ไข</button>
      </div>
    </div>
  `).join('');
}

window.handleImgUpload = async (input) => {
  if (currentImages.length >= 3) { toast('สูงสุด 3 รูปเท่านั้น', 'err'); return; }
  const files = Array.from(input.files).slice(0, 3 - currentImages.length);
  for (const file of files) {
    const name = Date.now() + '_' + file.name;
    const r = sRef(storage, 'products/' + name);
    toast('กำลังอัปโหลด...');
    try {
      const snap = await uploadBytes(r, file);
      const url = await getDownloadURL(snap.ref);
      currentImages.push(url);
      renderImgPreview();
    } catch(e) { toast('อัปโหลดไม่สำเร็จ', 'err'); }
  }
  input.value = '';
};

function renderImgPreview() {
  const el = document.getElementById('imgPreview');
  el.innerHTML = currentImages.map((url, i) => `
    <div class="img-preview-item">
      <img src="${url}">
      <button class="img-del" onclick="delImg(${i})">✕</button>
    </div>
  `).join('');
}

window.delImg = (i) => {
  currentImages.splice(i, 1);
  renderImgPreview();
};

window.openAddModal = () => {
  editingId = null;
  currentImages = [];
  document.getElementById('addTitle').textContent = '+ เพิ่มสินค้า';
  document.getElementById('delBtn').style.display = 'none';
  ['fTitle', 'fGame', 'fDesc', 'fPrice', 'fStock'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fCat').value = 'mobile';
  document.getElementById('fBadge').value = '';
  renderImgPreview();
  openOv('ovAdd');
};

window.openEditModal = (id) => {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  currentImages = p.images || [];
  document.getElementById('addTitle').textContent = '✏ แก้ไขสินค้า';
  document.getElementById('delBtn').style.display = 'block';
  document.getElementById('fTitle').value = p.title;
  document.getElementById('fGame').value = p.game;
  document.getElementById('fCat').value = p.cat;
  document.getElementById('fDesc').value = p.desc;
  document.getElementById('fPrice').value = p.price;
  document.getElementById('fStock').value = p.stock;
  document.getElementById('fBadge').value = p.badge || '';
  renderImgPreview();
  openOv('ovAdd');
};

window.saveProduct = async () => {
  const title = document.getElementById('fTitle').value.trim();
  const game = document.getElementById('fGame').value.trim();
  const price = parseFloat(document.getElementById('fPrice').value);
  const stock = parseInt(document.getElementById('fStock').value);
  if (!title || !game || isNaN(price)) { toast('กรุณากรอกข้อมูลให้ครบ', 'err'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';

  try {
    let customId = '';
    if (!editingId) {
      // รันรหัสสินค้า A0001
      const lastProd = allProducts.sort((a,b) => (a.createdAt||0)-(b.createdAt||0)).pop();
      let nextNum = 1;
      if (lastProd && lastProd.customId && lastProd.customId.startsWith('A')) {
        nextNum = parseInt(lastProd.customId.substring(1)) + 1;
      }
      customId = 'A' + nextNum.toString().padStart(4, '0');
    }

    const data = {
      title, game,
      cat: document.getElementById('fCat').value,
      desc: document.getElementById('fDesc').value.trim(),
      price, stock,
      badge: document.getElementById('fBadge').value,
      images: currentImages,
      updatedAt: Date.now()
    };

    if (editingId) {
      await set(ref(db, 'products/' + editingId), { ...allProducts.find(x=>x.id===editingId), ...data });
    } else {
      data.createdAt = Date.now();
      data.customId = customId;
      await push(ref(db, 'products'), data);
    }
    closeOv('ovAdd');
    toast('บันทึกสำเร็จ');
  } catch(e) { toast('เกิดข้อผิดพลาด', 'err'); }
  btn.disabled = false; btn.textContent = '💾 บันทึก';
};

window.deleteProduct = async () => {
  if (!editingId || !confirm('ยืนยันลบสินค้านี้?')) return;
  try {
    await remove(ref(db, 'products/' + editingId));
    closeOv('ovAdd');
    toast('ลบสำเร็จ');
  } catch(e) { toast('ลบไม่สำเร็จ', 'err'); }
};

window.saveSettings = async () => {
  const data = {
    name: document.getElementById('sName').value.trim() || 'GameShop',
    fb: document.getElementById('sFb').value.trim(),
    desc: document.getElementById('sDesc').value.trim()
  };
  try {
    await set(ref(db, 'shop'), data);
    toast('บันทึกการตั้งค่าแล้ว');
  } catch(e) { toast('บันทึกไม่สำเร็จ', 'err'); }
};

window.switchTab = (btn, id) => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById(id).classList.add('on');
};
window.openOv = (id) => document.getElementById(id).classList.add('on');
window.closeOv = (id) => document.getElementById(id).classList.remove('on');
window.toast = (msg, type) => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type === 'err' ? ' err' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
};
</script>
</body>
</html>
